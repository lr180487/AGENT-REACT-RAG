[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agente-react-rag"
version = "3.0.0"
description = "Agente ReAct con FastAPI, memoria, búsqueda web y recuperación RAG."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9",
  "aiosqlite>=0.20",
  "httpx>=0.27,<1.0",
  "websockets>=12,<16",
  "langchain-core>=0.3,<2.0",
  "ddgs>=9.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
postgres-psycopg2 = ["psycopg2-binary>=2.9"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.9",
  "httpx>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "app/data"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
